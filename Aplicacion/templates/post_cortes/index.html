{% extends 'base.html' %} {% block content %}

<h1>{% block title %}Post Sobre Cortes de Cabello{% endblock %}</h1>

{% for post in posCortes | reverse %}

<div class="card" style="width: 18rem">
  <div class="card-body">
    <h5 class="card-title">{{post.title}}</h5>
    <p class="card-text">{{post.url}}</p>
    <a
      href="{{url_for('post.getcortes', url= post.url)}}"
      class="btn btn-primary"
      >Ver Post</a
    >
  </div>
</div>

{% endfor %} {% endblock %}
