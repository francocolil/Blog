{% extends 'base.html' %} {% block content %}

<h1>{% block title %}Post Sobre Moda{% endblock %}</h1>

{% for getpostmoda in postModa | reverse %}

<div class="card" style="width: 18rem">
  <div class="card-body">
    <h5 class="card-title">{{getpostmoda.title}}</h5>
    <p class="card-text">{{getpostmoda.url}}</p>
    <a
      href="{{url_for('getpostmoda.getmoda', url= getpostmoda.url)}}"
      class="btn btn-primary"
      >Ver Post</a
    >
  </div>
</div>

{% endfor %} {% endblock %}
